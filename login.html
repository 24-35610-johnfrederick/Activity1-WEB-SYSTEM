<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeGuard - Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0369a1 100%);
            min-height: 100vh;
            color: #fff;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            box-shadow: none;
            border-color: #38bdf8;
        }

        .btn-custom {
            background-color: #0284c7;
            color: #fff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #0369a1;
            color: #fff;
        }

        .btn-custom:disabled {
            background-color: rgba(200, 200, 200, 0.4);
            color: #888;
            border-color: transparent;
            cursor: not-allowed;
        }

        /* Red text style para sa validation errors */
        label.error {
            color: #ff8888;
            font-size: 0.875rem;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card glass-card shadow-lg p-4 text-center">
                    <div class="mb-3">
                        <i class="fa-solid fa-shield-halved text-info display-4"></i>
                        <h2 class="fw-bold mt-2">LifeGuard</h2>
                        <p class="text-light opacity-75 small">Smart Classroom System</p>
                    </div>
                    
                    <!-- Alert message container -->
                    <div id="alertMsg" class="alert d-none mb-3" role="alert"></div>

                    <form id="myForm" action="#" method="POST">
                        <div class="mb-3 text-start">
                            <label for="username" class="form-label text-light">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username">
                        </div>

                        <div class="mb-4 text-start">
                            <label for="password" class="form-label text-light">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-custom w-100 py-2 mb-3 rounded-pill">Login</button>
                    </form>

                    <div class="text-light small">
                        Don't have an account? <a href="register.html" class="text-info text-decoration-underline fw-bold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        $(document).ready(function(){
            let attempts = 0;
            const maxAttempts = 3;
            const lockTime = 30;
            let lockoutInterval = null;

            // Tinatanggap pareho ang static creds ng project requirements
            const validAccounts = [
                { user: "admin", pass: "12345" },
                { user: "admin123", pass: "password123" }
            ];

            $("#myForm").validate({
                rules: {
                    username: {
                        required: true,
                        minlength: 5,
                        maxlength: 15
                    },
                    password: {
                        required: true,
                        minlength: 5,
                        maxlength: 15
                    }
                },
                messages: {
                    username: {
                        required: "Kailangan ang username.",
                        minlength: "Dapat hindi bababa ng 5 characters.",
                        maxlength: "Dapat hindi tataas ng 15 characters."
                    },
                    password: {
                        required: "Kailangan ang password.",
                        minlength: "Dapat hindi bababa ng 5 characters.",
                        maxlength: "Dapat hindi tataas ng 15 characters."
                    }
                },
                errorPlacement: function(error, element) {
                    error.insertAfter(element);
                },
                submitHandler: function(form) {
                    const user = $("#username").val().trim();
                    const pass = $("#password").val();

                    const isValid = validAccounts.some(acc => acc.user === user && acc.pass === pass);

                    if (isValid) {
                        sessionStorage.setItem("isLoggedIn", "true");
                        sessionStorage.setItem("currentUser", user);

                        showAlert('success', 'Login successful! Redirecting to home page...');
                        attempts = 0;
                        
                        $("#loginBtn, #username, #password").prop("disabled", true);

                        setTimeout(function() {
                            window.location.href = "index.html";
                        }, 1500);
                    } else {
                        attempts++;
                        const remaining = maxAttempts - attempts;

                        if (attempts >= maxAttempts) {
                            lockAccount();
                        } else {
                            showAlert('warning', `Maling credentials. May natitira ka pang ${remaining} attempt(s).`);
                        }
                    }
                }
            });

            function lockAccount() {
                if (lockoutInterval) {
                    clearInterval(lockoutInterval);
                }

                $("#loginBtn, #username, #password").prop("disabled", true);

                let timeLeft = lockTime;
                showAlert('danger', `Naka-lockout ang account dahil sa 3 beses na maling subok! Subukan ulit pagkaraan ng <strong>${timeLeft}</strong> segundo.`);

                lockoutInterval = setInterval(() => {
                    timeLeft--;
                    $("#alertMsg").html(`Naka-lockout ang account dahil sa 3 beses na maling subok! Subukan ulit pagkaraan ng <strong>${timeLeft}</strong> segundo.`);

                    if (timeLeft <= 0) {
                        clearInterval(lockoutInterval);
                        $("#loginBtn, #username, #password").prop("disabled", false);
                        attempts = 0;
                        $("#alertMsg").addClass('d-none');
                    }
                }, 1000);
            }

            function showAlert(type, message) {
                $("#alertMsg")
                    .attr('class', `alert alert-${type} mb-3`)
                    .html(message)
                    .removeClass('d-none');
            }
        });
    </script>
</body>
</html>
