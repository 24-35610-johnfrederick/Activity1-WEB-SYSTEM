<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeGuard - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0369a1 100%);
            min-height: 100vh;
            color: #fff;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            box-shadow: none;
            border-color: #38bdf8;
        }

        .btn-custom {
            background-color: #0284c7;
            color: #fff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #0369a1;
            color: #fff;
        }

        /* Red text style para sa validation errors */
        label.error {
            color: #ff8888;
            font-size: 0.875rem;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card glass-card shadow-lg p-4 text-center">
                    <div class="mb-3">
                        <i class="fa-solid fa-user-plus text-info display-5"></i>
                        <h2 class="fw-bold mt-2">Register</h2>
                    </div>
                    
                    <!-- Alert message container -->
                    <div id="alertMsg" class="alert d-none mb-3" role="alert"></div>

                    <form id="registerForm" action="#" method="POST">
                        <div class="mb-3 text-start">
                            <label for="reg-username" class="form-label text-light">Username</label>
                            <input type="text" class="form-control" id="reg-username" name="username" placeholder="Choose a username">
                        </div>

                        <div class="mb-3 text-start">
                            <label for="email" class="form-label text-light">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                        </div>

                        <div class="mb-3 text-start">
                            <label for="reg-password" class="form-label text-light">Password</label>
                            <input type="password" class="form-control" id="reg-password" name="password" placeholder="Create a password">
                        </div>

                        <div class="mb-4 text-start">
                            <label for="confirm-password" class="form-label text-light">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm-password" name="confirm_password" placeholder="Confirm your password">
                        </div>

                        <button type="submit" class="btn btn-custom w-100 py-2 mb-3 rounded-pill">Register</button>
                    </form>

                    <div class="text-light small">
                        Already have an account? <a href="login.html" class="text-info text-decoration-underline fw-bold">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        $(document).ready(function() {
            $("#registerForm").validate({
                rules: {
                    username: {
                        required: true,
                        minlength: 8,
                        maxlength: 15
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        minlength: 8,
                        maxlength: 15
                    },
                    confirm_password: {
                        required: true,
                        equalTo: "#reg-password"
                    }
                },
                messages: {
                    username: {
                        required: "Kailangan ang username.",
                        minlength: "Dapat hindi bababa ng 8 characters.",
                        maxlength: "Dapat hindi lalagpas ng 15 characters."
                    },
                    email: {
                        required: "Kailangan ang email address.",
                        email: "Maglagay ng tamang email address."
                    },
                    password: {
                        required: "Kailangan ang password.",
                        minlength: "Dapat hindi bababa ng 8 characters.",
                        maxlength: "Dapat hindi lalagpas ng 15 characters."
                    },
                    confirm_password: {
                        required: "Kailangang kumpirmahin ang password.",
                        equalTo: "Hindi nagmamatch ang password."
                    }
                },
                errorPlacement: function(error, element) {
                    error.insertAfter(element);
                },
                submitHandler: function(form) {
                    const $btn = $(form).find('button[type="submit"]');
                    $btn.prop('disabled', true);

                    $("#alertMsg")
                        .attr('class', 'alert alert-success mb-3')
                        .html('Registration successful! Redirecting to login...')
                        .removeClass('d-none');
                    
                    setTimeout(function() {
                        window.location.href = "login.html";
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>
